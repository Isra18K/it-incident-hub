trigger:
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - refactor/*

# Usa 'Default' (o el nombre del Agent Pool donde registraste tu agente local autohospedado)
pool:
  name: 'Default'

variables:
  NODE_VERSION: '20.x'
  DB_HOST: $(SECRET_DB_HOST)
  DB_PASSWORD: $(SECRET_DB_PASSWORD)

stages:
  - stage: CI_Build_Test_Security
    displayName: 'CI: Compilación, Pruebas y Seguridad'
    jobs:
      - job: BuildAndValidate
        displayName: 'Construir, Probar y Empaquetar'
        steps:
          # 1. Checkout
          - checkout: self
            displayName: '1. Checkout del repositorio'

          # 2. Instalación de dependencias
          - script: |
              cd backend
              npm install
              cd ../frontend
              npm install
            displayName: '2. Instalación y restauración de paquetes (Backend & Frontend)'

          # 3. Build del Frontend
          - script: |
              cd frontend
              npm run build
            displayName: '3. Compilación (Build) de producción Frontend'

          # 4. Ejecución de Pruebas Automatizadas
          - script: |
              node --test tests/incident.test.js
            displayName: '4. Ejecución de Pruebas Unitarias'

          # 5. Revisión de Dependencias y Seguridad
          - script: |
              cd backend
              npm audit --audit-level=critical
              cd ../frontend
              npm audit --audit-level=critical || true
            displayName: '5. Auditoría de Seguridad de Dependencias (npm audit)'

          # 6. Empaquetado de la versión lista para desplegar
          - task: ArchiveFiles@2
            displayName: '6. Empaquetado del Artefacto (ZIP)'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/it-incident-hub-$(Build.BuildId).zip'
              replaceExistingArchive: true

          # 7. Publicación del Artefacto
          - task: PublishBuildArtifacts@1
            displayName: '7. Publicación de Artefacto de Release'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop-incident-hub'
              publishLocation: 'Container'